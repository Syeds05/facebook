<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New account</title>
</head>
<body style="background-color: lightgray;">
    <center><h1 style="color: blue;">Create a New Account</h1>
    <h5>it's quick and easy.</h5>
    <form action="">
        <table style="width: 530px; height:300px; background-color:white">
            <tr>
                <td>First Name:  <input type="username" placeholder="First Name" required autofocus>
                    Last Name: <input type="username" placeholder="Last Name" required autofocus></td>
                 
            </tr>
            <tr>
                <td>Mobile number or Email: <br> <input type="mobile or email" placeholder="Mobile Number or Email" required autofocus></td>
            </tr>
            <tr>
                <td>New Password: <br> <input type="password" placeholder="New password" required autofocus></td>
            </tr>
            <tr>
                <td>Date of birth: <br>  <input type="date" placeholder="Date of birth" required autofocus></td>
            </tr>
            <tr>
                 <td>Gender:<input type="radio" name="gen">Male<input type="radio" name="gen">Female<input type="radio" name="gen">Others</td>
            </tr>
            <tr>
                <td><input type="submit" value="Log in"></td> 
            </tr>
        </table>

    </form><br><br>
    <a href="./facebooksite.html">Back in login</a>
    </center>
    
</body>
</html>
